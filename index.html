<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══ GLOBAL SEO — per-page title/description/canonical/hreflang via <Seo> ═ -->
    <meta name="author" content="Ahmed Darwish — BznsFlow" />
    <!-- robots is NOT set here. It lives in <Seo>, which uses vite-react-ssg's
         own <Head>, so exactly one tag per page is emitted. A copy in this
         template would sit outside that management and could not be replaced:
         it would ship alongside the per-page one, and /signin would carry both
         "index, follow" and "noindex, follow". Google resolves that by taking
         the most restrictive, so it happened to work, but only by relying on
         crawler tiebreaking. -->

    <!-- ═══ OPEN GRAPH defaults — per-page url/title/description/image via <Seo> ═ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BznsFlow" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BznsFlow — AI Receptionist, Booking & WhatsApp Order Automation, in Arabic & English" />

    <!-- ═══ TWITTER / X CARD — per-page title/description/image via <Seo> ══ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@bznsflow" />

    <!-- ═══ FAVICON ════════════════════════════════════════════════════════ -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ═══ FONTS ═══════════════════════════════════════════════════════════
         Poppins for Latin, IBM Plex Sans Arabic for Arabic — the pairing in
         Brand/Visual-System. IBM Plex Sans Arabic is drawn as an Arabic text
         face rather than adapted from a Latin one, which is why it replaces
         Cairo on a site where Arabic is the canonical language.

         Five weights each instead of the previous seven: 300 and 900 were
         loaded on both families and used by neither. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load asynchronously so fonts never block first paint, then swap media to all. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <meta name="facebook-domain-verification" content="gp7mxwceshctr5x1y0hrrmukfa1q0j" />

    <!-- ═══ SCROLL-REVEAL GATE — runs pre-paint so prerendered content is only
         hidden when JS + IntersectionObserver are available and the visitor
         has not requested reduced motion. The failsafe re-shows everything
         if hydration ever fails after the gate opens. ═══════════════════════ -->
    <script>
      if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('js-reveal');
        setTimeout(function () { document.documentElement.classList.add('reveal-failsafe'); }, 4000);
      }
    </script>

    <!-- Marketing instrumentation is disabled in Blue. -->
  </head>
  <body>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
